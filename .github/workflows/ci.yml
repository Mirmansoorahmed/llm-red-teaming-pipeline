name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Default profile is `oss`: no cloud account, no network, no GPU, and all
# optional runner extras (garak / AgentDojo / PyRIT / promptfoo) UNINSTALLED.
# The harness core is standard-library only, so CI installs nothing but pytest.
jobs:
  oss:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest only (no harness runtime deps, no extras)
        run: python -m pip install --upgrade pip pytest
      - name: Lint (optional)
        run: |
          if python -m pip show ruff >/dev/null 2>&1; then ruff check src tests; \
          else echo "ruff not installed; skipping (optional)"; fi
      - name: Run tests
        run: python -m pytest
